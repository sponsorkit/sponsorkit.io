name: Release SDKs

# Publish an SDK by pushing a tag:
#   sdks/js/v0.1.0       -> npm (@sponsorkit/sdk)
#   sdks/dotnet/v0.1.0   -> NuGet (Sponsorkit)
#   sdks/python/v0.1.0   -> PyPI (sponsorkit)
#   sdks/rust/v0.1.0     -> crates.io (sponsorkit)
#   sdks/go/v0.1.0       -> Go modules need no publish step (proxy.golang.org picks up the tag)
#
# All registries use trusted publishing (OIDC), so no long-lived tokens are stored.
# Configure a trusted publisher for this repository + workflow on each registry first.

on:
  push:
    tags:
      - "sdks/js/v*"
      - "sdks/dotnet/v*"
      - "sdks/python/v*"
      - "sdks/rust/v*"

permissions:
  contents: read
  id-token: write

jobs:
  npm:
    if: startsWith(github.ref, 'refs/tags/sdks/js/v')
    runs-on: ubuntu-latest
    environment: release
    steps:
      - uses: actions/checkout@v5
      - uses: oven-sh/setup-bun@v2
      - uses: actions/setup-node@v5
        with:
          node-version: 24
          registry-url: https://registry.npmjs.org
      - run: npm install -g npm@latest
      - run: bun install --frozen-lockfile
      - run: bun run build && bun run test
        working-directory: sdks/js
      - run: npm publish --access public
        working-directory: sdks/js

  nuget:
    if: startsWith(github.ref, 'refs/tags/sdks/dotnet/v')
    runs-on: ubuntu-latest
    environment: release
    steps:
      - uses: actions/checkout@v5
      - uses: oven-sh/setup-bun@v2
      - run: bun install --frozen-lockfile
      - uses: actions/setup-dotnet@v5
        with:
          dotnet-version: 10.0.x
      - run: dotnet test sdks/dotnet
      - run: dotnet pack sdks/dotnet -c Release -o out
      - uses: NuGet/login@v1
        id: nuget
        with:
          user: ${{ vars.NUGET_USER }}
      - run: dotnet nuget push "out/*.nupkg" --api-key "${{ steps.nuget.outputs.NUGET_API_KEY }}" --source https://api.nuget.org/v3/index.json

  pypi:
    if: startsWith(github.ref, 'refs/tags/sdks/python/v')
    runs-on: ubuntu-latest
    environment: release
    steps:
      - uses: actions/checkout@v5
      - uses: actions/setup-python@v6
        with:
          python-version: "3.13"
      - run: python -m pip install build && python -m build
        working-directory: sdks/python
      - uses: pypa/gh-action-pypi-publish@release/v1
        with:
          packages-dir: sdks/python/dist

  crates:
    if: startsWith(github.ref, 'refs/tags/sdks/rust/v')
    runs-on: ubuntu-latest
    environment: release
    steps:
      - uses: actions/checkout@v5
      - uses: dtolnay/rust-toolchain@stable
      - uses: rust-lang/crates-io-auth-action@v1
        id: auth
      - run: cargo publish
        working-directory: sdks/rust
        env:
          CARGO_REGISTRY_TOKEN: ${{ steps.auth.outputs.token }}
