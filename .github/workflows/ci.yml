name: CI

on:
  push:
    branches: [main]
  pull_request:
  # Re-run CI by hand from the Actions tab.
  workflow_dispatch:

permissions:
  contents: read

concurrency:
  group: ci-${{ github.ref }}
  # Superseded pull request runs are cancelled; runs on main finish so a deploy is never cut off halfway.
  cancel-in-progress: ${{ github.event_name == 'pull_request' }}

jobs:
  typescript:
    name: Shared, Worker, conformance kit
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v5
      - uses: oven-sh/setup-bun@v2
      - run: bun install --frozen-lockfile
      - name: Shared
        run: bun run typecheck && bun test
        working-directory: packages/shared
      - name: Worker
        run: bun run typecheck && bun run test
        working-directory: app
      - name: Conformance kit
        run: bun run typecheck && bun test
        working-directory: sdks/conformance

  web:
    # Builds the site WITH the generated API reference of every SDK, tests it, and hands web/out to the
    # Cloudflare deploy job as the `site` artifact.
    name: Website & docs
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v5

      # Toolchains the reference generators need (sdks/<lang>/scripts/gen-docs.sh).
      - uses: oven-sh/setup-bun@v2
      - uses: actions/setup-node@v5
        with:
          node-version: 22
      - uses: actions/setup-dotnet@v5
        with:
          dotnet-version: 10.0.x
      - uses: actions/setup-python@v6
        with:
          python-version: "3.13"
          cache: pip
          cache-dependency-path: sdks/python/pyproject.toml
      - uses: actions/setup-go@v6
        with:
          go-version: "1.25"
          cache-dependency-path: |
            sdks/go/go.mod
            sdks/go/scripts/gendocs/go.mod
      - uses: dtolnay/rust-toolchain@stable
      - uses: Swatinem/rust-cache@v2
        with:
          workspaces: |
            sdks/rust
            sdks/rust/scripts/docgen
      - name: Cache bun and NuGet packages
        uses: actions/cache@v4
        with:
          path: |
            ~/.bun/install/cache
            ~/.nuget/packages
          key: web-${{ runner.os }}-${{ hashFiles('bun.lock', 'sdks/dotnet/**/*.csproj', 'sdks/dotnet/Directory.Build.props') }}
          restore-keys: web-${{ runner.os }}-

      - run: bun install --frozen-lockfile
      - name: Python SDK virtualenv
        working-directory: sdks/python
        run: |
          python -m venv .venv
          # pip only warns about an undefined extra, so `docs` is picked up as soon as pyproject.toml adds it.
          .venv/bin/pip install -e '.[dev,docs]'
      - run: bunx playwright install --with-deps chromium
        working-directory: web

      - name: Generate API reference (all languages, strict)
        run: bun run --cwd web docs:generate --strict
      - name: Typecheck and unit tests
        working-directory: web
        run: bun run typecheck && bun run test
      - name: Build (fails if a language reference is missing)
        run: bun run --cwd web build
        env:
          DOCS_STRICT: "1"
      - name: Check links
        run: bun run --cwd web docs:check-links
      # Same as the tail of `bun run test:e2e` (docs, pages, checkout, ...) without building a second time.
      - name: End-to-end tests
        working-directory: web
        run: bunx playwright test --trace off
      - name: Worker bundles with the static site
        run: bunx wrangler deploy --dry-run --outdir /tmp/wrangler
        working-directory: app

      - uses: actions/upload-artifact@v4
        with:
          name: site
          path: web/out
          include-hidden-files: true
          if-no-files-found: error
          retention-days: 7

  sdk-js:
    name: SDK (JS/TS)
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v5
      - uses: oven-sh/setup-bun@v2
      - uses: actions/setup-node@v5
        with:
          node-version: 22
      - run: bun install --frozen-lockfile
      - run: bun run typecheck && bun run lint && bun run test && bun run test:dist
        working-directory: sdks/js

  sdk-dotnet:
    name: SDK (.NET)
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v5
      - uses: oven-sh/setup-bun@v2
      - run: bun install --frozen-lockfile
      - uses: actions/setup-dotnet@v5
        with:
          dotnet-version: 10.0.x
      - run: dotnet test sdks/dotnet
      - run: dotnet pack sdks/dotnet -c Release -o /tmp/nupkg

  sdk-python:
    name: SDK (Python ${{ matrix.python }})
    runs-on: ubuntu-latest
    strategy:
      fail-fast: false
      matrix:
        python: ["3.10", "3.13"]
    steps:
      - uses: actions/checkout@v5
      - uses: oven-sh/setup-bun@v2
      - run: bun install --frozen-lockfile
      - uses: actions/setup-python@v6
        with:
          python-version: ${{ matrix.python }}
      - name: Test
        working-directory: sdks/python
        run: |
          python -m venv .venv
          .venv/bin/pip install -e '.[dev]'
          .venv/bin/ruff check .
          .venv/bin/mypy
          .venv/bin/pytest

  sdk-go:
    name: SDK (Go ${{ matrix.go }})
    runs-on: ubuntu-latest
    strategy:
      fail-fast: false
      matrix:
        go: ["1.23", "1.25"]
    steps:
      - uses: actions/checkout@v5
      - uses: oven-sh/setup-bun@v2
      - run: bun install --frozen-lockfile
      - uses: actions/setup-go@v6
        with:
          go-version: ${{ matrix.go }}
      - name: Test
        working-directory: sdks/go
        run: |
          test -z "$(gofmt -l .)"
          go vet ./...
          go test -race ./...

  sdk-rust:
    name: SDK (Rust ${{ matrix.toolchain }})
    runs-on: ubuntu-latest
    strategy:
      fail-fast: false
      matrix:
        toolchain: [stable, "1.85"]
    steps:
      - uses: actions/checkout@v5
      - uses: oven-sh/setup-bun@v2
      - run: bun install --frozen-lockfile
      - uses: dtolnay/rust-toolchain@master
        with:
          toolchain: ${{ matrix.toolchain }}
          components: rustfmt, clippy
      - name: Lint
        if: matrix.toolchain == 'stable'
        working-directory: sdks/rust
        run: |
          cargo fmt --check
          cargo clippy --all-targets -- -D warnings
      - name: Test
        working-directory: sdks/rust
        run: cargo test

  deploy:
    name: Deploy to Cloudflare
    needs: [typescript, web]
    # Enable by setting the repository variable DEPLOY_ENABLED=true and the
    # secrets CLOUDFLARE_API_TOKEN and CLOUDFLARE_ACCOUNT_ID.
    if: github.event_name == 'push' && github.ref == 'refs/heads/main' && vars.DEPLOY_ENABLED == 'true'
    runs-on: ubuntu-latest
    environment: production
    steps:
      - uses: actions/checkout@v5
      - uses: oven-sh/setup-bun@v2
      - run: bun install --frozen-lockfile
      # Deploy exactly what the Website & docs job built and tested (with the API reference) instead of
      # rebuilding here without the SDK toolchains.
      - uses: actions/download-artifact@v5
        with:
          name: site
          path: web/out
      - run: bunx wrangler deploy
        working-directory: app
        env:
          CLOUDFLARE_API_TOKEN: ${{ secrets.CLOUDFLARE_API_TOKEN }}
          CLOUDFLARE_ACCOUNT_ID: ${{ secrets.CLOUDFLARE_ACCOUNT_ID }}
