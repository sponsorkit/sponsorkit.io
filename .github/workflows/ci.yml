name: CI

on:
  push:
    branches: [main]
  pull_request:

permissions:
  contents: read

concurrency:
  group: ci-${{ github.ref }}
  cancel-in-progress: true

jobs:
  typescript:
    name: Shared, Worker, conformance kit
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v5
      - uses: oven-sh/setup-bun@v2
      - run: bun install --frozen-lockfile
      - name: Shared
        run: bun run typecheck && bun test
        working-directory: packages/shared
      - name: Worker
        run: bun run typecheck && bun run test
        working-directory: app
      - name: Conformance kit
        run: bun run typecheck && bun test
        working-directory: sdks/conformance

  web:
    name: Website
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v5
      - uses: oven-sh/setup-bun@v2
      - run: bun install --frozen-lockfile
      - run: bunx playwright install --with-deps chromium
        working-directory: web
      - run: bun run typecheck && bun run test && bun run test:e2e
        working-directory: web
      - name: Worker bundles with the static site
        run: bunx wrangler deploy --dry-run --outdir /tmp/wrangler
        working-directory: app

  sdk-js:
    name: SDK (JS/TS)
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v5
      - uses: oven-sh/setup-bun@v2
      - uses: actions/setup-node@v5
        with:
          node-version: 22
      - run: bun install --frozen-lockfile
      - run: bun run typecheck && bun run lint && bun run test && bun run test:dist
        working-directory: sdks/js

  sdk-dotnet:
    name: SDK (.NET)
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v5
      - uses: oven-sh/setup-bun@v2
      - run: bun install --frozen-lockfile
      - uses: actions/setup-dotnet@v5
        with:
          dotnet-version: 10.0.x
      - run: dotnet test sdks/dotnet
      - run: dotnet pack sdks/dotnet -c Release -o /tmp/nupkg

  sdk-python:
    name: SDK (Python ${{ matrix.python }})
    runs-on: ubuntu-latest
    strategy:
      fail-fast: false
      matrix:
        python: ["3.10", "3.13"]
    steps:
      - uses: actions/checkout@v5
      - uses: oven-sh/setup-bun@v2
      - run: bun install --frozen-lockfile
      - uses: actions/setup-python@v6
        with:
          python-version: ${{ matrix.python }}
      - name: Test
        working-directory: sdks/python
        run: |
          python -m venv .venv
          .venv/bin/pip install -e '.[dev]'
          .venv/bin/ruff check .
          .venv/bin/mypy
          .venv/bin/pytest

  sdk-go:
    name: SDK (Go ${{ matrix.go }})
    runs-on: ubuntu-latest
    strategy:
      fail-fast: false
      matrix:
        go: ["1.23", "1.25"]
    steps:
      - uses: actions/checkout@v5
      - uses: oven-sh/setup-bun@v2
      - run: bun install --frozen-lockfile
      - uses: actions/setup-go@v6
        with:
          go-version: ${{ matrix.go }}
      - name: Test
        working-directory: sdks/go
        run: |
          test -z "$(gofmt -l .)"
          go vet ./...
          go test -race ./...

  sdk-rust:
    name: SDK (Rust ${{ matrix.toolchain }})
    runs-on: ubuntu-latest
    strategy:
      fail-fast: false
      matrix:
        toolchain: [stable, "1.85"]
    steps:
      - uses: actions/checkout@v5
      - uses: oven-sh/setup-bun@v2
      - run: bun install --frozen-lockfile
      - uses: dtolnay/rust-toolchain@master
        with:
          toolchain: ${{ matrix.toolchain }}
          components: rustfmt, clippy
      - name: Lint
        if: matrix.toolchain == 'stable'
        working-directory: sdks/rust
        run: |
          cargo fmt --check
          cargo clippy --all-targets -- -D warnings
      - name: Test
        working-directory: sdks/rust
        run: cargo test

  deploy:
    name: Deploy to Cloudflare
    needs: [typescript, web]
    # Enable by setting the repository variable DEPLOY_ENABLED=true and the
    # secrets CLOUDFLARE_API_TOKEN and CLOUDFLARE_ACCOUNT_ID.
    if: github.event_name == 'push' && github.ref == 'refs/heads/main' && vars.DEPLOY_ENABLED == 'true'
    runs-on: ubuntu-latest
    environment: production
    steps:
      - uses: actions/checkout@v5
      - uses: oven-sh/setup-bun@v2
      - run: bun install --frozen-lockfile
      - run: bun run build
        working-directory: web
      - run: bunx wrangler deploy
        working-directory: app
        env:
          CLOUDFLARE_API_TOKEN: ${{ secrets.CLOUDFLARE_API_TOKEN }}
          CLOUDFLARE_ACCOUNT_ID: ${{ secrets.CLOUDFLARE_ACCOUNT_ID }}
