[build-system]
requires = ["hatchling>=1.21"]
build-backend = "hatchling.build"

[project]
name = "sponsorkit"
version = "0.1.0"
description = "Build GitHub Sponsors and Open Collective contributions directly into your software: check who supports you, open a checkout, nag politely."
readme = "README.md"
license = "MIT"
requires-python = ">=3.10"
authors = [{ name = "Sponsorkit contributors" }]
keywords = ["sponsorship", "github-sponsors", "opencollective", "donations", "open-source", "funding"]
classifiers = [
  "Development Status :: 4 - Beta",
  "Intended Audience :: Developers",
  "Operating System :: OS Independent",
  "Programming Language :: Python :: 3",
  "Programming Language :: Python :: 3 :: Only",
  "Programming Language :: Python :: 3.10",
  "Programming Language :: Python :: 3.11",
  "Programming Language :: Python :: 3.12",
  "Programming Language :: Python :: 3.13",
  "Typing :: Typed",
]
dependencies = ["httpx>=0.24,<1"]

[project.optional-dependencies]
dev = ["pytest>=8", "pytest-asyncio>=0.23", "ruff>=0.5", "mypy>=1.10", "jsonschema>=4.20"]

[project.urls]
Homepage = "https://sponsorkit.io"
Repository = "https://github.com/sponsorkit/sponsorkit.io"
Documentation = "https://sponsorkit.io/docs"
Issues = "https://github.com/sponsorkit/sponsorkit.io/issues"

[tool.hatch.build.targets.wheel]
packages = ["src/sponsorkit"]

[tool.hatch.build.targets.sdist]
include = ["src/sponsorkit", "README.md", "pyproject.toml"]

[tool.pytest.ini_options]
testpaths = ["tests"]
asyncio_mode = "auto"
asyncio_default_fixture_loop_scope = "function"
addopts = "-ra"

[tool.ruff]
line-length = 110
target-version = "py310"
src = ["src", "tests"]
extend-exclude = ["*.md"]

[tool.ruff.lint]
select = ["E", "F", "W", "I", "B", "UP", "SIM", "RUF", "N", "C4", "PT", "D"]
ignore = ["D105", "D107", "D203", "D213", "D401", "D413", "RUF022"]

[tool.ruff.lint.per-file-ignores]
"tests/**" = ["D", "PT018"]

[tool.mypy]
python_version = "3.10"
strict = true
files = ["src", "tests"]

[[tool.mypy.overrides]]
module = ["jsonschema", "jsonschema.*"]
ignore_missing_imports = true
